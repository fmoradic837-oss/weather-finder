<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Finder</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body>
  <main class="weather-card">
    <p class="eyebrow">WEATHER LOOKUP</p>
    <h1>How's the weather?</h1>
    <p class="muted">Search a city to see current weather details.</p>
    <form id="search-form" class="search-form">
      <label class="sr-only" for="city-input">City name</label>
      <input id="city-input" placeholder="Enter a city (e.g. Tehran)" required maxlength="80">
      <button type="submit">Search</button>
    </form>
    <p id="status" class="status" role="status">Search for a city to begin.</p>
    <section id="weather-result" class="weather-result" hidden>
      <div class="result-heading"><div><p id="location" class="location"></p><p id="description" class="description"></p></div><span id="weather-icon" class="weather-icon">☀️</span></div>
      <p id="temperature" class="temperature"></p>
      <div class="details"><div><span>Feels like</span><strong id="feels-like">—</strong></div><div><span>Humidity</span><strong id="humidity">—</strong></div><div><span>Wind</span><strong id="wind">—</strong></div></div>
    </section>
    <p class="api-note">Data provided by Open-Meteo. No API key required.</p>
  </main>
</body>
</html>
